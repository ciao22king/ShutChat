[package]
name = "shutchat-core"
version = "0.1.0"
edition = "2021"
description = "ShutChat wire protocol: invite codes, room crypto, envelopes, framing"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"

[package]
name = "shutchat"
version = "0.1.0"
edition = "2021"
description = "ShutChat for Linux: peer to peer messenger with no server and no accounts"
license = "Apache-2.0"

[dependencies]
shutchat-core = { path = "../core" }
slint = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
rand = "0.8"
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
dirs = "5"
notify-rust = "4"
arboard = "3"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls"] }

[build-dependencies]
slint-build = "1"
